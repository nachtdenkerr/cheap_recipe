[project]
name = "cheaprecipe"
version = "0.1.0"
description = "Recipes curated from reduced-price grocery items"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "sqlalchemy",
    "pandas",
    "requests",
    "python-dotenv",
    "openai",
    "langfuse",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cheaprecipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
