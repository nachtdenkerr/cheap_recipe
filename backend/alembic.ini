# Alembic, for the database schema (src/cheaprecipe/db/migrations).
#
# The API and the CLI migrate on their own (cheaprecipe.db.session.migrate);
# this file is for making new migrations:
#
#   uv run alembic revision --autogenerate -m "what changed"
#   uv run alembic upgrade head
#
# The database is DATABASE_URL, else data/cheaprecipe.db (session.database_url).

[alembic]
script_location = %(here)s/src/cheaprecipe/db/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
